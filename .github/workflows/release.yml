name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build all multi-platform binaries
        id: build
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Building WorkBuddy International Edition v${VERSION}..."
          chmod +x ./build.sh
          ./build.sh "${VERSION}"

      - name: Prepare Release Notes
        run: |
          cat << 'EOF' > release_body.md
          ## WorkBuddy 国际版发布说明

          ### SHA-256 二进制校验表
          EOF
          if [ -f dist/checksums.md ]; then
            cat dist/checksums.md >> release_body.md
          elif [ -f dist/checksums.txt ]; then
            echo '```' >> release_body.md
            cat dist/checksums.txt >> release_body.md
            echo '```' >> release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/workbuddy-intl-*
            dist/checksums.txt

  docker:
    name: Build & Push Docker Image
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, 'alpha') && !contains(github.ref, 'beta') && !contains(github.ref, 'rc') }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
